# Future Crew - Second Reality (Assembly '93), on the machine it was written
# for: a 486DX2/66 with a Tseng ET4000 and a Sound Blaster Pro.
#
# A: is the shared FreeDOS boot floppy, which chains to C:\AUTORUN.BAT; C: is
# the demo. Both are built by scripts/make-pc-disks.sh and both paths are
# relative to this file (see resolve_config_paths() in PCem's pc.c).
#
# Needs system/pcem/roms/ami486/ and system/pcem/roms/et4000.bin.
#
# The demo opens on its own SETUP screen -- sound card, mixing quality, looping
# -- and starts on Enter. The Gravis it defaults to is emulated too (gus = 1),
# so any of the three cards on that menu will play.
model = ami486
cpu_manufacturer = 0
cpu = 10
fpu = builtin
cpu_use_dynarec = 1
mem_size = 8192
gfxcard = et4000ax
sndcard = sbprov2
gus = 1

# The demo wants 570,000 bytes of conventional memory free and, for either
# Sound Blaster, 1MB of EMS. Both come from the boot floppy's JEMMEX.
disc_a = fdboot.img

# PCem takes the geometry from here, not from the image, so these three have to
# stay in step with CYLINDERS/HEADS/SECTORS in scripts/make-pc-disks.sh.
hdd_controller = ide
hdc_fn = 2ndreality.img
hdc_cylinders = 120
hdc_heads = 4
hdc_sectors = 17

cdrom_drive = 0
