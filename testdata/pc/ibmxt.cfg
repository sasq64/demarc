# IBM PC/XT, 640K, CGA, no disks. With nothing to boot from, the 1981 BIOS
# falls through to the Cassette BASIC in ROM, which is a fixed, unmistakable
# screen and so makes a good end-of-boot marker for the PCem core test.
#
# Needs system/pcem/roms/ibmxt/ and system/pcem/roms/mda.rom (the latter also
# carries the 8x8 CGA font the test reads the screen back with).
model = ibmxt
cpu_manufacturer = 0
cpu = 0
cpu_use_dynarec = 0
mem_size = 640
gfxcard = cga
sndcard = none
hdd_controller = none
cdrom_drive = 0
