# IBM PC/XT, 640K, CGA, no disks. With nothing to boot from, the 1986 BIOS
# falls through to the Cassette BASIC in ROM, which is a fixed, unmistakable
# screen and so makes a good end-of-boot marker for the 86Box core test.
#
# Needs system/86box/roms/machines/ibmxt86/ and system/86box/roms/video/mda/mda.rom
# (the latter also carries the 8x8 CGA font the test reads the screen back with).

[Machine]
machine = ibmxt86
cpu_family = 8088
cpu_speed = 4772728
cpu_use_dynarec = 0
mem_size = 640
time_sync = disabled

[Video]
gfxcard = cga

[Input devices]
mouse_type = none

[Sound]
sndcard = none

[Floppy and CD-ROM drives]
fdd_01_type = none
fdd_02_type = none

[Hard disks]
hdc = none
