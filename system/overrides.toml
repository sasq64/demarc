# Axxelerate: enables GL_DEPTH_TEST once and clears the window's depth only on
# the first frame. After a swap NVIDIA's is no longer 1.0, so every later
# full-screen quad fails GL_LEQUAL: black with music. Also pow(vec3, float),
# which NVIDIA rejects, and an int if-condition, which Mesa rejects.
[zoo.31450]
fix_info = '''
Black with music on NVIDIA. It enables GL_DEPTH_TEST once and clears the
window's depth only on the first frame; after a swap NVIDIA's window depth no
longer passes GL_LEQUAL for a z=0 quad, so every later full-screen quad is
discarded. Two exe patches clear depth when Framebuffer::disable binds the
window and before the load-bar quad. glsl edits fix pow(vec3, float), rejected
by NVIDIA, and an int if-condition, rejected by Mesa. autodlg's --check
Fullscreen now takes a textless checkbox's label from the Static before it,
which this dialog uses.
'''
patch = [
  { info = "clear depth when Framebuffer::disable binds the window", target = "axxelerate.exe", offset = 68978, contents = "oVz4TACLAGoAaECNAAD/0GgAAQAA6BCbAQCQ" },
  { info = "clear depth before the load bar quad", target = "axxelerate.exe", offset = 41559, contents = "aAABAADoOwYCAGoH6AQGAgAxwIkEJIlEJASQkJCQkJA=" },
]
glsl = [
  { match = 'pow\(blur\(\)', edits = [['pow\(blur\(\) \* 4\.7, 4\.0\)', "pow(blur() * 4.7, vec3(4.0))"]] },
  { match = 'if\(autoBias\)', edits = [['if\(autoBias\)', "if(autoBias != 0)"]] },
]

