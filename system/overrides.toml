# fr-063: Magellan / Farbrausch. Its task scheduler asserts that no worker has
# started yet, but they start themselves after 5 ms; fewer cores only makes
# that rarer.
[zoo.829]
fix_info = '''
The task scheduler asserts Threads[i]->Running==0 after creating its workers,
but each worker sets Running itself 5 ms after it starts, so the assert fires
at random. Lowering wine_cpus (to 4, then 8) only made the race rarer. The exe
is unpacked, so a byte patch NOPs out the assert's branch.
'''
file = "fr-063_v1.02.zip"
patch = {
  info = "skip the Threads[i]->Running==0 assert",
  target = "fr-063.exe",
  offset = 2215481,
  contents = "kJA=",
}

# Ballad of a Cluster Bomb Director's Cut by Kooma: locks its quad vertex
# buffers with the vertex count as the byte size.
[zoo.878]
fix_info = '''
Only the dark canvas showed, on both DXVK and wined3d. The post-process quads
are updated with Lock(0, 4, ...) followed by a 96-byte copy: the helper passes
the vertex count where D3D9 wants bytes. Windows uploads the whole buffer
anyway; DXVK and wined3d upload only the 4 locked bytes, so every quad stayed
degenerate. Found by making each pass's shader output a solid colour. The patch
passes 0 (lock everything). The 1.02/1.03 patches only change OpenCV linking.
'''
patch = {
  info = "lock the whole quad vertex buffer",
  target = "bomb_dc.exe",
  offset = 287859,
  contents = "McmQ",
}

