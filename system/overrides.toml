Most effects were black. They render to pbuffers through Mark Harris'
RenderTexture, with the mode "rgb double depth aux=1 tex2D rtt". No Xwayland
GLX config has aux buffers, so wglChoosePixelFormatARB found no format and no
pbuffer was made. The patch asks for aux=0, and the effects render without it.
