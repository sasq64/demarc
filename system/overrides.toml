After GetSystemDirectoryA the intro does `mov cl,15; rep movsb`, assuming the
upper bytes of ECX are zero as on Windows. Wine leaves them set, so the copy
runs off the end of .data. The patch rewrites the sequence to set all of ECX
before the rep movsb.
'''
