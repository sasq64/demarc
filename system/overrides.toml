# Overrides for specific demos from demozoo
# Can selects which file to download, and which file in the archive to load
# Can also add meta data and patch files from the archive, data as base64 and full replacement for now
# 'fast = true' runs an Amiga release on an accelerated A1200 (68030+FPU, 8MB fast, 128MB Z3, JIT);
# options written in the same entry are applied on top of it.

[zoo.15]
boot = "HEAVEN7W.EXE"

# [zoo.100]
# wine = {
#   WINEARCH = "win32",
#   WINEDLLOVERRIDES = "mscoree,mshtml=",
# }

[zoo.102]
file = "rgba_tbc_elevated_2016.zip"
boot = "elevated_1280x720.exe"

[zoo.108]
file = "2nd_real.zip"

[zoo.138]
file = "variform_by_kewlers.zip"

[zoo.7236]
boot = "dEEP"
file = "CNCD_PRX-Deep.lha"
fast = true

# Closer / CNCD
[zoo.7613]
assign = { CNCD = "SYS:" }

# Klone / DCS
[zoo.8120]
meta = { amiga_core = "puae" }

# Killer / CNCD
[zoo.19401]
assign = { Killer = "SYS:" }
fast = true

[zoo.18030]
file = "inside.zip"
patch = {
  info = "GUS 0x240",
  target = "SOUND.CFG",
  contents = "U0RJR1VTLkRTRAAAAAoAAAAGAAAAQAIAAAMAAAAFAAAAfAY2HQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMAAAABAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
}

# Ninja II by Melon Dezign
[zoo.18032]
file = "ninja2.zip"
patch = {
  info = "GUS 0x240",
  target = "NINJA2.CFG",
  contents = "AAAAAAEAAABAAgAA//////////9ErAAACgAAAA==",
}

[zoo.68604]
file = "puls.zip"
libretro = { dosbox_pure_cycles = "max" }

# Tube by Baze / 3CS
[zoo.57849]
libretro = { dosbox_pure_cycles = 150000 }

[zoo.90015]
boot = "dEEPMiX"
fast = true

[zoo.119665]
assign = { Love = "SYS:" }

[zoo.211926]
assign = { retro = "SYS:" }

[zoo.322619]
file = "dkg^lmn-neocolora.lha"

[zoo.376675]
meta = { amiga_core = "puae" }

