[zoo.119665]
assign = { Love = "SYS:" }

[zoo.122582]
libretro = { aga = "true" }

# On / Mercury: a texture() bias in a vertex shader and an implicit vec3 to
# float, which NVIDIA 610 rejects.
[zoo.136151]
fix_info = '''
It asserts with int3 when GL_COMPILE_STATUS is false; the NVIDIA error was
only in the intro's memory. The kkrunchy-unpacked sources are plain strings in
the image, read from /proc/<pid>/mem and checked with glslang. glsl edits
replace a texture() bias in a vertex shader with textureLod and add .x to
implicit vec3/vec2-to-float narrowing, which NVIDIA 610 rejects and older
drivers accepted.
'''
glsl = [
  { match = 'texture\(iv,kk,0\)', edits = [['texture\(iv,kk,0\)', "textureLod(iv,kk,0.)"]] },
  { match = 'hm\(0,w,mod', edits = [['hm\(0,w,mod\(abs\(p\),vec3\(1\)\)\)', "hm(0,w,mod(abs(p),vec3(1)).x)"]] },
  { match = "float arg=vec2", edits = [['float arg=vec2\( gk\(1\),gk\(2\) \)', "float arg=gk(1)"]] },
]

# 8K Reality / Fulcrum: NVIDIA-only GLSL, l (and bo in the final) are vec3
# used as floats, and floats passed as vec2.
[zoo.136330]
fix_info = '''
It crashed in wglUseFontOutlinesA with garbage arguments: Crinkler's range
import landed two exports past wglUseFontBitmapsA in wine's table
(docs/CRINKLER.md mode 1), and the extra popped bytes later overwrote the
start time so it quit after one frame. Its GLSL is NVIDIA-only: l (and bo in
the final) are vec3 used as floats, and floats passed as vec2; glsl edits
declare them float and wrap the arguments in vec2().
'''
glsl = [
  { match = 'vec3 f,r,l=vec3\(0\);', edits = [['vec3 f,r,l=vec3\(0\);', "vec3 f,r;float l=0;"]] },
  { match = "vec3 f,r,l=0,bo=0;", edits = [["vec3 f,r,l=0,bo=0;", "vec3 f,r;float l=0,bo=0;"]] },
  { match = 'float t=vec3\(mod\(', edits = [['float t=vec3\(mod\(', "float t=(mod("]] },
  { match = 'float l=floor\(f\.x/25\)', edits = [['\bs\((l(\*\d)?)\)', "s(vec2($1))"]] },
]

# Fruit Cake / Deus: "Cannot initialize sound driver" when it finds the GUS.
[zoo.98448]
meta = { dosbox_pure_gus = "false" }

# Hologram / Mercury: a vec3 and a vec2 assigned to floats and default
# parameter values, which NVIDIA 610 rejects.
[zoo.119170]
fix_info = '''
It asserts with int3 when GL_COMPILE_STATUS is false (NVIDIA 610). Its shader
sources were found by running on software Mesa with MESA_SHADER_DUMP_PATH and
checking every dump with glslang, adding glsl edits until none failed (all 60
compile at load). The edits fix vec3/vec2 assigned to floats, and default
parameter values (float r=1.1), which no current compiler accepts: those are
stripped, and one function that a caller relies on the default for gets an
overload instead.
'''
glsl = [
  { match = 'float ady=vec3\(', edits = [['float ady=vec3\(', "float ady=float("]] },
  { match = "float aad=vec2", edits = [['float aad=vec2\( jy\(1\),jy\(2\) \)', "float aad=jy(1)"]] },
  { match = 'akm=\(gl_FragCoord', edits = [['akm=\(gl_FragCoord([^;]*);', "akm=((gl_FragCoord$1).x;"]] },
  { match = 'float oa\( vec3 p,vec2 al,float r=1\.1 \)\{', edits = [['float oa\( vec3 p,vec2 al,float r=1\.1 \)\{', "float oa(vec3 p,vec2 al,float r);float oa(vec3 p,vec2 al){return oa(p,al,1.1);}float oa(vec3 p,vec2 al,float r){"]] },
  {
    match = '[(,] ?(?:float|int) \w+ ?= ?[-\d.]+ ?[,)]',
    edits = [
      ['([(,] ?(?:float|int) \w+) ?= ?[-\d.]+( ?[,)])', "$1$2"],
      ['([(,] ?(?:float|int) \w+) ?= ?[-\d.]+( ?[,)])', "$1$2"],
    ]
  },
]

# Ziphead / CNCD & Fairlight: with ntsync the render thread queues on ntdll's
# fd_cache_mutex for seconds at a time; the picture stalls, the music plays on.
[zoo.136314]
fix_info = '''
Picture froze for seconds while the music played on. A frame counter in the
gamescope core, then the render thread's context switches and its futex
address mapped through nm ntdll.so, showed it queueing on ntdll's
fd_cache_mutex, which ntsync misses take around a wineserver call. wine_ntsync
= false hides /dev/ntsync in the sandbox and removed every stall. LAA and
cache_writeback were tried first and did nothing.
'''
meta = { wine_ntsync = "false" }

[zoo.136167]
download = "https://github.com/sasq64/demodb/releases/download/demo-arc/8088mph_86box.zip"

# Surveillance / Alcatraz. Its shader is NVIDIA-only GLSL (vec4 - vec2, a float
# assigned to a vec4).
[zoo.155010]
fix_info = '''
White screen. Its shader is NVIDIA-only GLSL (vec4 - vec2, a float assigned to
a vec4), so wine_glsl_version did nothing; RUST_LOG=retro=warn shows Mesa's
errors. glsl regex edits fix it in every build; a MESA_SHADER_READ_PATH
replacement only matched one of its four exes, since the hash covers baked-in
constants.
'''
glsl = {
  match = "gl_FragCoord-s",
  edits = [
    ['gl_FragCoord-s\.xy', "gl_FragCoord.xy-s.xy"],
    ['l=\.4;', "l=vec4(.4);"],
  ]
}

