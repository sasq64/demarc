# Transformer 3 by Limp Ninja (OPENRNDR). Asks GLFW for a 3.3 core context and
# calls glBlendEquationi (4.0); NVIDIA's Linux driver reports exactly 3.3, so
# LWJGL never loads it and the JVM aborts. The jar asks for 4.3 instead.
[zoo.202844]
fix_info = '''
An OPENRNDR (LWJGL) demo asking GLFW for a 3.3 core context and then calling
glBlendEquationi (4.0). NVIDIA gives exactly the version asked for and LWJGL
loads nothing above it, so the JVM aborted; Mesa gives the highest version and
was fine. The jar is patched to ask for 4.3, a recompressed class put in place
of the original (its central directory lists entries twice), shipped as
win/patches/transformer3.bsdiff.

Freezes in the first minute: HotSpot 11 looks for a critical JNI entry each
time it wraps a native, enumerating every module through psapi, which under
wine is thousands of wineserver round trips. LWJGL has one native per GL
function, so each new scene stalled. -XX:-CriticalJNINatives in the launcher
cfg skips the lookup.
'''
patch = [
  {
    info = "GL 4.3 context",
    target = "demo-evoke-1.0-SNAPSHOT.jar",
    format = "bsdiff",
    source = "win/patches/transformer3.bsdiff",
  },
  {
    info = "no critical JNI lookups",
    target = "Transformer3.cfg",
    contents = "",
  },
]

# Click Clack, Lobster attack! by Lobstarrs. Its libjpeg spills progressive
# JPEGs to tmpfile(), which the old CRT creates in the drive root (Z: = `/`
# under wine): "Failed to load wise_guy.jpg". Raise jpeg_mem_init's 1 MB
# DEFAULT_MAX_MEM to 256 MB so it never does.
[zoo.8196]
fix_info = '''
"Failed to load wise_guy.jpg" for a file that exists. The statically linked
libjpeg spills progressive JPEGs to tmpfile(), which the old MSVC CRT creates
in the root of the current drive, and with the cwd on Z: (= /) that is access
denied. The patch raises jpeg_mem_init's DEFAULT_MAX_MEM (mov eax,1000000)
from 1 MB to 256 MB, so libjpeg never spills.
'''
patch = {
  info = "libjpeg max memory 256 MB",
  target = "lobstarrs-attack.exe",
  offset = 827777,
  contents = "AAAAEA==",
}

