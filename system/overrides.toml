# Spilled by Archee: D3DMULTISAMPLE_NONMASKABLE quality 4 is 16 samples to DXVK,
# which NVIDIA lacks, and multisampled GL points are circles that let the clear
# colour through, so wined3d without multisampling
[zoo.51354]
fix_info = '''
It asks for D3DMULTISAMPLE_NONMASKABLE quality 4, which DXVK reads as 1 << 4 =
16 samples; NVIDIA's Vulkan lacks that, CreateDevice fails and the intro
dereferences NULL. wined3d accepts it, but multisampled GL points are circles
and the clear colour shows through. So d3d9=b (wined3d) with wine_d3d_config
SampleCount=0 (WINE_D3D_CONFIG), a meta key added for this, which turns
multisampling off.
'''
boot = "spilled_qc_1024.exe"
meta = { wine_dll_overrides = "d3d9=b", wine_d3d_config = "SampleCount=0" }

