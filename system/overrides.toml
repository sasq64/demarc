# Into the Shadows / Triton: its blit runs off the end of the video segment and
# switches VESA bank in the #GP handler, a fault only the normal core raises.
[zoo.118585]
fix_info = '''
Black right after setting a banked VESA mode. Its blit runs off the end of the
video segment and expects the resulting #GP at the segment limit, switching
VESA bank in the fault handler. Only dosbox-pure's normal core raises that
fault, so dosbox_pure_cpu_core = normal. Found by logging int 10h 4Fxx calls
and dumping guest memory at the crash (RUST_LOG=retro=debug showed Crash:
INT:Gate Selector).
'''
events = [{ frame = 300, key = "Enter" }]
libretro = { dosbox_pure_cpu_core = "normal" }

