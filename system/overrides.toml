Died calling a user32 stub ("Call from 7BB8C557"). Its Crinkler tiny import
hashes every user32 export into one table, and wine's user32 also has
ShellHandwritingHandleDelegatedInput, whose slot is GetDC's and which sorts
after it, so GetDC was the stub. demarc now unpacks Crinkler exes and imports
by name (docs/CRINKLER.md). It draws at 1280x720 and only fills part of a
larger screen.
'''
