# te-2rb 7002 by TPOLM
[zoo.270858]
fix_info = '''
Froze with the music playing: under wine the first BASS position query can see
the play cursor equal to the write offset, which BASS 0.x takes as a full wrap,
and its search for a negative position never ends. bass.dll is packed, so the
unpacker's last jump goes through a cave that makes the search unsigned.
The click picks "watch fullscreen"; the menu ignores keys. It sits low because
the window is 637x451, not the 640x480 the click is scaled over.
'''
meta = { wine_res = "640x480" }
events = [{ frame = 300, click = [0.477, 0.955] }]
patch = [
  { info = "unpacker exit jumps to the cave", target = "bass.dll", offset = 602, contents = "0gsAAA==" },
  { info = "jle/jg to jbe/ja in the position search", target = "bass.dll", offset = 3632, contents = "xgXsiwEQdsYFBIwBEHfpoXz+/w==" },
]

