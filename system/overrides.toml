"No OpenGL 1.2 compatible driver found" on a 4.6 context. It reads the minor
version as the digit after strstr(GL_VERSION, "1."), which lands on "arch1.1"
in Mesa's version string. Two patches in sgz_arise.exe assume GL 1.4 and skip
the version digit checks.
