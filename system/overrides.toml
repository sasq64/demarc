# Tension by x0f
[zoo.269513]
fix_info = '''
Crashed at the first frame or, at random, exited silently while loading. One
op calls GenerateMips with its texture index still -1, passing a texture as
the SRV: DXVK reads NULL from it and wined3d asserts. Its render targets are
made in a loop that never resets the size between formats, so it asks for
textures up to 33554432 wide; the D3D11 runtime refuses anything over 16384,
but DXVK hands the 32768 ones to the driver, which sometimes faults in
vkAllocateMemory. The exe is kkrunchy packed, so the depacker jumps through a
cave that, once unpacked, skips GenerateMips for index -1 and fails
CreateTexture2D above 16384.
'''
patch = [
  { info = "depacker exit jumps to the cave", target = "tension_partyversion.exe", offset = 22075, contents = "6SAEAAA=" },
  { info = "cave: skip GenerateMips for index -1, no textures over 16384", target = "tension_partyversion.exe", offset = 23136, contents = "D3e+nJo/AMcFzpc/AKTC///pzPv//8YF2GJAAOnHBdliQADA9/7/xgUBIEAA6ccFAiBAAK46///pJhYBAIXAeA7/NIWQpEAAUf+S2AAAAOkyCAEAiwhSUIH/AEAAAHcI/1EU6UDFAACDxBC4VwAHgOkzxQAA" },
]

