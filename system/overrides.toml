# Crystal Dream / Triton: its Sound Blaster detection times out on a fast CPU.
# Picks Sound Blaster Pro, 44 kHz. Its player starts the next block once the
# DSP stops reporting busy, which an SB16 never does.
[zoo.174]
fix_info = '''
The Sound Blaster detection is a timing loop that runs out at dosbox-pure's
default 200000 cycles ("Could not find output device!"), so cycles are lowered
to 10000. Sound then stopped after 1.4 s: the player starts the next DMA block
only when polling port 22C reads the DSP as idle, which the SB16 never
reports, so the card is set to SB Pro 2. Keys pick Sound Blaster Pro at 44 kHz
in its setup.
'''
events = [{ frame = 100, key = "5" }, { frame = 150, key = "8" }]
meta = { dosbox_pure_cycles = 10000, dosbox_pure_sblaster_type = "sbpro2" }

