# Off The Shelf / Psycho: GeForce 8 era GLSL path tracer.
[zoo.4768]
fix_info = '''
Stayed black: its #version 120 shader uses atan2 (a Cg name) and round
(GLSL 1.30), which old NVIDIA accepted. The failed link left the uniforms
at -1. glsl edits replace atan2 and round.
'''
glsl = {
  match = "atan2",
  edits = [['atan2\(', "atan("], ['round\(', "floor(.5+"]],
}

# fr-065: Euphotic / Farbrausch. Its 3D text in Georgia crashes the mesh code
# under wine.
[zoo.5151]
fix_info = '''
Crashed with a page fault in the werkkzeug3 mesh code during loading. The 3D
text op tessellates GetGlyphOutline outlines with glu32, links the triangles'
edges and flips thin ones; for the four credits in Georgia (2.05, as on XP) the
links come out wrong and the flips read unset corners, so where it dies depends
on heap garbage. Not DXVK (wined3d crashes too) and not the garbage itself
(zeroed allocations still crash). Under winedbg it fails every time, which is
the way to test. The patches set those four ops' font to Verdana.
'''
patch = [
  { info = "visualice credit in verdana", target = "fr-065_euphotic.exe", offset = 758074, contents = "dmVyZGFuYQ==" },
  { info = "melwyn credit in verdana", target = "fr-065_euphotic.exe", offset = 758094, contents = "dmVyZGFuYQ==" },
