# Adelanto by Nostalgia. Logs GL_EXTENSIONS through a 0x800 heap buffer,
# which today's extension list overruns, and allocates a texture of
# GL_MAX_TEXTURE_SIZE squared (768 MB at 16384). Its mode switch also asks
# for exactly 60 Hz, which a session at the screen's refresh does not offer.
[zoo.46032]
fix_info = '''
autodlg never answered the setup dialog because it belongs to a child process
(e3d_setup.exe) the demo waits for; autodlg now searches child processes too,
and reads modes spelled 640*480 in combos. Three patches in adelanto.exe: skip
logging GL_EXTENSIONS into a 0x800 heap buffer that today's extension list
overruns; cap the texture it allocates at GL_MAX_TEXTURE_SIZE squared (768 MB
at 16384) to 2048; and switch modes without DM_DISPLAYFREQUENCY, since it asks
for exactly 60 Hz, which the session may not have.
'''
boot = "adelanto.exe"
patch = [
  {
    info = "skip logging GL_EXTENSIONS, max texture size 2048",
    target = "adelanto.exe",
    offset = 80251,
    contents = "6w3sp0IAVuhgFgAAg8QMjX4YxwcACAAAkJCQkJCQ",
  },
  {
    info = "mode switch without DM_DISPLAYFREQUENCY",
    target = "adelanto.exe",
    offset = 80791,
    contents = "HA==",
  },
]

