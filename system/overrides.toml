# fr-080: ATI-era GLSL that NVIDIA and Mesa reject (pow(vec4, float), 1-vec4,
# writing a varying)
[zoo.4701]
fix_info = '''
The shaders are 2011 ATI-lax GLSL that neither NVIDIA nor Mesa accepts:
pow(vec4, float), 1-vec4, and writes to a varying. The error only showed in
the demo's own message box (WINEDEBUG=+msgbox prints it). The override's glsl
regex edits, applied by the opengl32 proxy at compile time, add the vec4()
casts, use 1. and remove the varying writes.
'''
glsl = {
  match = "gl_FragColor",
  edits = [
    ['pow\(c,e1\*4\.\)', "pow(c,vec4(e1*4.))"],
    ['pow\(rc\+bc,2\.\*e3\)', "pow(rc+bc,vec4(2.*e3))"],
    ['mix\(c,1-c,e8\)', "mix(c,1.-c,e8)"],
    ['tc\.z=1\.;', ""],
    ['tc\.z\+', "1.+"],
    ['/1\.1\),0\.2\+e1\*3\.0\)', "/1.1),vec3(0.2+e1*3.0))"],
  ]
}

