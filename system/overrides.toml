# Organix by rgba
[zoo.51295]
known_issue = """
Black. The intro renders fine (the DIB dumped from memory holds the image) and
blits it in a loop, but its window never reaches the session. It is created at
0x0 with WS_MAXIMIZE (CreateWindowEx "static", 0x97000000, 0,0,0,0); Xwayland
then makes one buffer-less commit on its surface and none after, so gamescope
shows a stale square surface ("client covers 1024x1024"). A test exe that does
the same reproduces it; the same window created at full size works. Hide/show,
resizing after map and answering the buffer-less commit's frame callback in
gamescope did not help. Also wants a 1280x1024 mode (letterboxed1024 exe), so
wine_res = 1280x1024 is needed once the above is solved. See docs/LEARNINGS.md.
"""

