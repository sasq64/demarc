It asks for a GL 3.3 context without naming a profile, gets a core one, and
calls glActiveTextureARB during FBO setup without checking; wine's
wglGetProcAddress does not resolve ARB names on a core context, so it called
NULL. wine_gl_compat gives it a compatibility context. Its GL-drawn launcher
is answered with two clicks: High texture quality, then Run.
'''
