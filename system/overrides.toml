or winedbg. One PCX is 275 wide with 276 bytes per line and the decoder writes
the padding byte too, running 264 bytes past its buffer into wine's heap
metadata. The exe was unpacked with upx -d, its allocation raised to 0x11ca0,
repacked with upx --best and shipped as win/patches/akkordarbeit.bsdiff. cnc-
ddraw for the display.
'''
