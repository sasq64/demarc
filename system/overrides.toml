# fr-080: ATI-era GLSL that NVIDIA and Mesa reject (pow(vec4, float), 1-vec4,
# writing a varying)
[zoo.4701]
glsl = {
  match = "gl_FragColor",
  edits = [
    ['pow\(c,e1\*4\.\)', "pow(c,vec4(e1*4.))"],
    ['pow\(rc\+bc,2\.\*e3\)', "pow(rc+bc,vec4(2.*e3))"],
    ['mix\(c,1-c,e8\)', "mix(c,1.-c,e8)"],
    ['tc\.z=1\.;', ""],
    ['tc\.z\+', "1.+"],
    ['/1\.1\),0\.2\+e1\*3\.0\)', "/1.1),vec3(0.2+e1*3.0))"],
  ]
}

