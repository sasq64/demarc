failure: wglChoosePixelFormatARB for WGL_TYPE_RGBA_FLOAT_ARB found nothing
(Xwayland's GLX has no float fbconfigs), so the pbuffer was NULL. The opengl32
proxy now emulates float pbuffers. After that it read NV fragment programs
this ATI-only release does not ship, which it does whenever
GL_NV_fragment_program is present; a one-byte patch spoils that name in the
exe's extension check so it takes the ARB path.
'''
