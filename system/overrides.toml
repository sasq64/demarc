# fr-063: Magellan / Farbrausch. Its task scheduler asserts that no worker has
# started yet, but they start themselves after 5 ms; fewer cores only makes
# that rarer.
[zoo.829]
fix_info = '''
The task scheduler asserts Threads[i]->Running==0 after creating its workers,
but each worker sets Running itself 5 ms after it starts, so the assert fires
at random. Lowering wine_cpus (to 4, then 8) only made the race rarer. The exe
is unpacked, so a byte patch NOPs out the assert's branch.
'''
file = "fr-063_v1.02.zip"
patch = {
  info = "skip the Threads[i]->Running==0 assert",
  target = "fr-063.exe",
  offset = 2215481,
  contents = "kJA=",
}

# Patter by Doom. Its aspect fit scales by the screen width instead of the
# height when the screen is wider than 16:10, and centres with an unsigned
# shift; wine draws the resulting 0x7ffffdc0 offscreen.
[zoo.1697]
fix_info = '''
The aspect fit scales by screen width instead of height when the screen is
wider than 16:10 and centres with an unsigned shift; wine then draws at a
0x7ffffdc0 offset, off screen. Two one-byte patches change `mov eax,ecx` to
`mov eax,esi` so it fits to height. The patch offset is the second byte of the
instruction (the one that changes); writing over the opcode turned it into
`mov cl,imm8` and crashed later.
'''
patch = [
  { info = "fit to height", target = "patter4k_windows7.exe", offset = 5023, contents = "xg==" },
  { info = "fit to height", target = "patter4k_windows7.exe", offset = 5042, contents = "xg==" },
]

