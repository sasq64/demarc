# Nature v2.0 by Threepixels. The 3D scenes leave camera-space texgen and an
# env-map texture matrix on stage 0, and its pre-transformed 2D quads (the
# render-target copy, image layers) never clear them; Windows ignores both
# for XYZRHW vertices, DXVK and wined3d do not. Unpacked, each
# SetVertexShader(0x144) goes through a stub that zeroes TEXCOORDINDEX and
# TEXTURETRANSFORMFLAGS first, repacked.
[zoo.8340]
patch = {
  info = "Reset texgen for 2D quads",
  target = "Nature v2.0.exe",
  format = "bsdiff",
  source = "win/patches/nature2.bsdiff",
}

# Transformer 3 by Limp Ninja (OPENRNDR). Asks GLFW for a 3.3 core context and
# calls glBlendEquationi (4.0); NVIDIA's Linux driver reports exactly 3.3, so
# LWJGL never loads it and the JVM aborts. The jar asks for 4.3 instead.
[zoo.202844]
patch = {
  info = "GL 4.3 context",
  target = "demo-evoke-1.0-SNAPSHOT.jar",
  format = "bsdiff",
  source = "win/patches/transformer3.bsdiff",
}

