Stuck on its first frame. Crinkler mode 2 (docs/CRINKLER.md): OpenFile is
missing from wine's kernelbase, so its import resolved to AccessCheck and
silently corrupted the stack. demarc's kernelbase proxy supplies OpenFile. A
radeonsi glthread segfault seen in a bare-wine run was a red herring.
'''

# Your Fingers So Gently On My Skin
[zoo.8644]
fix_info = '''
It faulted in the CRT's fread on a NULL FILE*: its own loader uses tmpfile(),
which the old CRT creates in the drive root (Z: = / under wine, not writable).
The sandbox now overlays the release directory and maps it to a free drive
letter, so the root is writable and the files are thrown away. It then died on
NVIDIA with a GLX BadMatch in MakeContextCurrent: wine's wglBindTexImageARB
copies the pbuffer with its internal context, of a different pixel format; the
opengl32 proxy copies with a context made on the pbuffer's DC.
'''

# The Real Party Is In Your Pocket
[zoo.277164]
fix_info = '''
Showed its image for an instant, then black. No GLX config on NVIDIA's
Xwayland has an accumulation buffer, so every glAccum failed silently and only
the first swap showed a raw sample. The opengl32 proxy now emulates the
accumulation buffer with an FBO.
'''

# The Ink Test
[zoo.103547]
fix_info = '''
err:module:import_dll d3dcsx_43.dll not found, imported by its fwdfx.fx DLL.
Wine has no d3dcsx builtin and winetricks no verb, so the prefix build takes
d3dcsx_43.dll from the DirectX June 2010 redist that the d3dx9 verb already
downloads.
'''

# One Of Those Days
[zoo.185601]
fix_info = '''
It faulted on a NULL code blob right after D3DCompile, passing NULL for the
error blob. winetricks' d3dcompiler_47 is the Windows 8.1 SDK build
(6.3.9600), which rejects Windows 10 HLSL such as typed UAV loads of float4
(X3676). wine's builtin compiler compiled it but DXVK read past the end of its
DXBC. The prefix now takes d3dcompiler_47 10.0.15063 from lutris' d3d_extras.
'''

