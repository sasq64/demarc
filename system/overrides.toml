# Cassini's Cosmic Conclusion by Pestis & mrange
[zoo.367582]
fix_info = '''
Died calling a user32 stub, like Eisenerz (a Crinkler tiny-import slot that a
wine-only export also hashes to); fixed by demarc unpacking Crinkler exes and
importing by name. Then black: its window is created at 0x0 with WS_MAXIMIZE
(given the screen's size by the rebuilt exe's CreateWindowExA wrapper), and
it sets single-buffered pixel format 8 through gdi32, draws to the front
buffer and never swaps, reading a pixel back each frame. The rebuilt exe
calls opengl32's wglSetPixelFormat instead, so the opengl32 proxy makes the
format double-buffered and swaps after each glReadPixels (tools/opengl32,
needs --setup-wine).
'''

