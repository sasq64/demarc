# Overrides for specific demos from demozoo
# Can selects which file to download, and which file in the archive to load
# Can also add meta data and patch files from the archive, data as base64 and full replacement for now
# 'fast = true' runs an Amiga release on an accelerated A1200 (68030+FPU, 8MB fast, 128MB Z3, JIT);
# options written in the same entry are applied on top of it.

[zoo.20]
meta = { wine_res = "1024x768" }

[zoo.76]
# meta = { wine_dll_overrides = "d3dx9_31=n" }

[zoo.102]
