# which NVIDIA lacks, and multisampled GL points are circles that let the clear
# colour through, so wined3d without multisampling
[zoo.51354]
boot = "spilled_qc_1024.exe"
meta = { wine_dll_overrides = "d3d9=b", wine_d3d_config = "SampleCount=0" }

