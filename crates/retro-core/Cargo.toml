[package]
name = "retro-core"
version.workspace = true
edition.workspace = true
description = "libretro core loading and frame/audio plumbing, free of any frontend"

# `cdylib` is what an Android APK loads; `rlib` is what demarc links against.
# `doctest = false`: libretro.rs is bindgen output, and the C snippets bindgen
# copies out of the libretro headers are not Rust.
[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

# The minimal single-core player. `test = false`: the modules it uses carry
# their own unit tests, which the lib target already runs.
[[bin]]
name = "minimarc"
path = "src/bin/minimarc.rs"
required-features = ["player"]
test = false

[dependencies]
anyhow.workspace = true
libloading.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `find_core`'s search of demarc's own core cache.
dirs.workspace = true

# The window, surface and input for the `minimarc` player. Optional so that a plain
# `retro-core` — which is all demarc and an Android core host need — builds
# none of it.
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
# Audio out for the player: the same pair demarc's sink is built on. cpal 0.17
# reaches Android through AAudio (`ndk`, API 26+), so there is no C++ runtime to
# ship beside the core.
cpal = { version = "0.17.1", optional = true }
ringbuf = { version = "0.5.0", optional = true }

[dev-dependencies]
# PNG output for the tests that boot a real core and snapshot a frame.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
cc.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

# winit needs to be told which Android activity to build against, and pulls in
# `android-activity` to do it; without this it does not compile for the target
# at all. `android_main` (docs/ANDROID.md step 3) is what will use it.
[target."cfg(target_os = \"android\")".dependencies]
winit = { workspace = true, features = ["android-native-activity"], optional = true }

[features]
default = []
player = ["dep:winit", "dep:wgpu", "dep:pollster", "dep:cpal", "dep:ringbuf"]

# `minimarc` is a development tool, not something to release.
[package.metadata.dist]
dist = false
