[package]
name = "retro-core"
version.workspace = true
edition.workspace = true
description = "libretro core loading and frame/audio plumbing, free of any frontend"

# `doctest = false`: libretro.rs is bindgen output, and the C snippets bindgen
# copies out of the libretro headers are not Rust.
[lib]
doctest = false

[dependencies]
anyhow.workspace = true
libloading.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `find_core`'s search of demarc's own core cache.
dirs.workspace = true
# Audio out (`audio.rs`). cpal 0.17 reaches Android through AAudio (`ndk`, API
# 26+), so there is no C++ runtime to ship beside the core.
cpal = "0.17.1"
ringbuf = "0.5.0"
rubato = "0.16"
# Audio recording (`audio_recorder.rs`); MP3 builds LAME from C, so it is opt-in.
hound = "3.5.1"
mp3lame-encoder = { version = "0.2.5", optional = true }
id3 = { version = "1.17.2", optional = true }

[dev-dependencies]
# PNG output for the tests that boot a real core and snapshot a frame.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
cc.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

[features]
default = []
mp3 = ["dep:mp3lame-encoder", "dep:id3"]
