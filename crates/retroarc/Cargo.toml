[package]
name = "retroarc"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "RetroArch `.slangp` filter chains on plain wgpu, built off the render thread"

[dependencies]
# Fork of librashader 0.11.4, branch `demarc`: three preset-parser fixes demarc
# needs for Mega Bezel preset packs (`#reference "path" // comment` lines,
# reference depth counted per chain instead of per file, and unresolvable
# references skipped the way RetroArch skips them), the modf/frexp result types
# naga's SPIR-V frontend forgets to register, matrix varyings split per
# column, and a parallel `compile_preset_passes` so a 42-pass bezel preset does
# not spend 1.4 s in glslang. See docs/SHADERS.md.
librashader = { workspace = true }
tracing.workspace = true
wgpu.workspace = true
