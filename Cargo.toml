[package]
name = "demarc"
version.workspace = true
edition.workspace = true
description = "A command line emulator frontend for the demoscene"
readme = "README.md"
repository.workspace = true

# Lets `cargo binstall --git https://github.com/sasq64/demarc demarc` find the
# archives that `dist` uploads to the GitHub release. The default patterns
# binstall tries all embed the version in the file name; dist names its archives
# `demarc-<target>.<ext>` and puts the binary in a directory of the same name.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[workspace]
members = ["crates/newsys", "crates/retro-core", "crates/retro-ui", "crates/retroarc"]

# Shared by every crate in the workspace, so a version bump happens in one place.
[workspace.package]
version = "1.8.0-rc1"
edition = "2024"
repository = "https://github.com/sasq64/demarc"

# Only the dependencies more than one crate needs. Crate-local ones stay in the
# crate that uses them.
[workspace.dependencies]
anyhow = "1.0.102"
cc = "1"
dirs = "6.0.0"
# The version `bevy_egui` is built against, so `retro-ui` and demarc share one.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
# `image` for the still-image backend and the frontend's screenshots; the rest
# are used on both sides of the newsys boundary.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "tiff"] }
libc = "0.2"
libloading = "0.9"
librashader = {
  git = "https://github.com/sasq64/librashader",
  rev = "9fed63109652f50e352f4f08e4a8bcf75e518b5c",
  default-features = false,
  features = [
    "preprocess",
    "presets",
    "reflect-naga",
    "runtime-wgpu",
  ]
}
mlua = { version = "0.11", features = ["luau", "send"] }
percent-encoding = "2"
pollster = "0.4"
sha2 = "0.11"
suppaftp = "10"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
wgpu = "29"
winit = "0.30"
zip = { version = "8", default-features = false, features = ["deflate", "deflate64"] }

[dependencies]
anyhow.workspace = true
bevy = {
  version = "0.19.0",
  default-features = false,
  features = [
    "2d",
    "audio",
    "file_watcher",
    "ui",
  ]
}
clap = { version = "4.6.1", features = ["color", "derive"] }
cpal = "0.17.1"
dirs.workspace = true
libloading.workspace = true
# Unpacking a release, working out which machine it is, and getting it booted.
newsys = { path = "crates/newsys" }
rand = "0.10.1"
# The libretro layer, split out so it can be built for targets the rest of
# demarc cannot reach (see docs/ANDROID.md). Default features: no `player`.
retro-core = { path = "crates/retro-core" }
# The egui HUD, picker and dialogs; `src/egui_ui.rs` is its Bevy side.
retro-ui = { path = "crates/retro-ui" }
# The `.slangp` filter chains, and the only thing that links librashader.
retroarc = { path = "crates/retroarc" }
ringbuf = "0.5.0"
rubato = "0.16"
sha2.workspace = true
tempfile.workspace = true
thiserror = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
# Matches the wgpu version Bevy 0.19 uses; needed to name `SamplerBorderColor`,
# which Bevy doesn't re-export.
wgpu.workspace = true
zip.workspace = true

# egui, for the ongoing port of the frontend UI (src/egui_ui.rs). 0.42 is the
# release built against Bevy 0.19 and wgpu-types 29, matching the versions above.
# `picking` and `open_url` are off: the app does its own hit-testing and never
# opens a browser. `manage_clipboard` stays on so egui text fields can paste.
bevy_egui = {
  version = "0.42",
  default-features = false,
  features = [
    "default_fonts",
    "bevy_ui",
    "manage_clipboard",
    "render",
  ]
}
image.workspace = true
# `AppSettings::files`: the loaded databases, in the order they were given.
indexmap = "2"
mlua.workspace = true
percent-encoding.workspace = true
# `block_on` for the Flash backend's wgpu adapter/device requests.
pollster = { workspace = true, optional = true }
qbsdiff = "1.4.4"
# `--filter`: matched against each raw db line while collecting (see collect_db).
regex = "1"
suppaftp.workspace = true
ureq.workspace = true
# `src/overrides.rs`: db URLs, and the bsdiff deltas an override can carry.
url = "2"

# Ruffle brings its own `wgpu` (v27), distinct from the `wgpu = 29` above.
#
# That pulls wgpu-hal 27 into the lock file even with `flash` off, and wgpu-hal 27
# requires `windows = "0.58"` exactly. gpu-allocator 0.28 (a dep of wgpu-hal 29)
# only asks for `windows = ">=0.53, <=0.62"`, so the resolver is free to collapse
# it onto that 0.58 -- and then wgpu-hal 29's dx12 backend hands 0.58 `ID3D12Heap`
# values to `windows` 0.62 APIs and the MSVC build fails to compile. Cargo.lock
# therefore pins gpu-allocator 0.28 to `windows 0.62.2`; if `just win` ever dies
# in wgpu-hal/src/dx12 with "multiple different versions of crate windows", check
# that edge in Cargo.lock first.
ruffle_core = {
  git = "https://github.com/ruffle-rs/ruffle",
  rev = "6b83e349125a872e7db5fe80875f5cab64c1c6a9",
  features = [
    "default_compatibility_rules",
    "default_font",
    "aac",
    "audio",
    "lzma",
    "mp3",
    "nellymoser",
  ],
  optional = true
}
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "6b83e349125a872e7db5fe80875f5cab64c1c6a9", optional = true }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", rev = "6b83e349125a872e7db5fe80875f5cab64c1c6a9", optional = true }
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "6b83e349125a872e7db5fe80875f5cab64c1c6a9", optional = true }

resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `overrides.toml`, the per-release fixups read at startup (src/overrides.rs).
# 1.x follows the TOML 1.1 spec, which is what lets an entry's `patch = { ... }`
# span several lines; a 0.9 parser would reject the file as written.
# `preserve_order` keeps `shaders.toml`'s collections in the order it writes them
# (src/shader_dialog.rs).
toml = { version = "1.1.4", features = ["preserve_order"] }

[dev-dependencies]
# Encoding a patch the way overrides.toml carries one, in overrides_tests.
base64 = "0.23.1"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
# Runtime that drives the MPRIS D-Bus listener in src/media_keys.rs.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Preferred screen-saver inhibition path under Wayland: `zwp_idle_inhibit_v1`
# talks straight to the compositor, so it doesn't need a D-Bus idle daemon to be
# running (see src/screensaver.rs). All three are already in the tree via winit.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# Inhibit the freedesktop screen saver over D-Bus while running fullscreen, and
# expose an MPRIS media-player interface so media keys control the emulator.
zbus = { version = "5", features = ["tokio"] }

[target."cfg(unix)".dependencies]
# Used to dup2 fd 1 to /dev/null so libretro cores can't spew to stdout, while
# keeping the original stdout for tracing (see `silence_stdout` in main.rs).
libc.workspace = true

[features]
default = []
# Enables the Flash (SWF) backend (src/flash_emu.rs) and its Ruffle dependencies.
flash = [
  "dep:pollster",
  "dep:ruffle_core",
  "dep:ruffle_render",
  "dep:ruffle_render_wgpu",
  "dep:swf",
]

[profile.release]
opt-level = 2
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Profiling build: release-optimized but with debug symbols and no stripping so
# `perf`/flamegraph can attribute samples to Ruffle internals. Used for
# benchmarking the Flash backend (see src/flash_emu.rs `flash_bench`).
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Fast-iteration build: keeps opt-level=2 so the emulator/shaders run at a usable
# speed, but drops the ship-only settings that make rebuilds slow. Parallel codegen
# + incremental + no LTO link pass turns a one-file change from tens of seconds into
# a few. Use `cargo build --profile release-fast`.
[profile.release-fast]
inherits = "release"
strip = false
# Must be "off", not `false`: `false` means thin-*local* LTO, which combined with
# many codegen units + incremental produces `undefined hidden symbol: anon.*.llvm.*`
# link errors.
lto = "off"
incremental = true
codegen-units = 256
