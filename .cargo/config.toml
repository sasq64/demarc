# Repo root, for tests that reach the `system/` and `testdata/` directories
# beside this file. `CARGO_MANIFEST_DIR` no longer answers that question: since
# the workspace split it points at the crate, which for `crates/*` is two levels
# down. `relative = true` resolves against this file's parent, i.e. the root.
[env]
DEMARC_ROOT = { value = ".", relative = true }

# Frame pointers everywhere: perf's dwarf unwinder gets about two frames out of
# this binary, so `just flame` -- and any other profiler -- needs `fp` call
# graphs to see a stack at all. The --speed-test rate is the same either way.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]

# A thread a core starts itself gets the exe's default stack, which is 1 MiB
# on Windows against 8 on Linux. Repeats the flags above: target flags replace
# them.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "force-frame-pointers=yes", "-C", "link-arg=/STACK:8388608"]
