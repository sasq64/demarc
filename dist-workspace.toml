[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# release.yml is hand-edited: the Windows zip gets extra files appended after
# dist has packed it (see the "Add Windows extras to the zip" step). This keeps
# `dist init`/`generate` from overwriting that edit.
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Bevy's Linux build needs ALSA and udev headers; the runner image doesn't have
# them. Everything else the build needs (a C/C++ compiler for retro_log_shim.c,
# cbmconvert and the unrar shim) is already on the GitHub images.
[dist.dependencies.apt]
libasound2-dev = '*'
libudev-dev = '*'

# Publish the demo databases as their own release assets, so they can be
# downloaded without the Windows zip. Fetched rather than committed -- they are
# ~8MB each and regenerated regularly. This is a global artifact: the build runs
# once, in build-global-artifacts, not once per platform.
[[dist.extra-artifacts]]
artifacts = ["target/dl/csdb.txt.gz", "target/dl/demozoo.txt.gz"]
build = ["bash", "scripts/fetch-dbs.sh", "target/dl"]
